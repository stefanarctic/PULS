<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Curent alternativ (AC)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <h1>Curent alternativ</h1>
            <p>Simulator AC / DC — tensiune, curent, fază, fazor</p>
        </div>
    </header>

    <main class="layout" id="caLayout">
        <button type="button" id="toggleCaLeft" class="ca-toggle ca-toggle-left" aria-controls="leftPanel" aria-expanded="true" aria-label="Panou formule și măsurători">☰</button>

        <!-- LEFT PANEL -->
        <aside id="leftPanel" class="panel left">
            <div class="panelHeader">
                <h2>Formule &amp; măsurători</h2>
            </div>
            <div class="section">
                <h3>Unități de măsură în S.I.</h3>
                <div class="box">
                    <p>U — V (volt)</p>
                    <p>I — A (amper)</p>
                    <p>f — Hz (hertz)</p>
                    <p>φ — rad (radian)</p>
                </div>
            </div>

            <div class="section">
                <h3>Formule și măsurători</h3>
                <div class="box">
                    <div id="formula"></div>
                    <div id="rms"></div>
                    <div id="cosphi"></div>
                    <div id="indicators"></div>
                </div>
            </div>
            <div id="analysis"></div>
            <div class="section">
                <h3>Energie</h3>
                <div class="box" id="energy"></div>
            </div>
            <div class="section">
                <h3>Fază</h3>
                <div class="box" id="phaseInfo"></div>
            </div>
        </aside>

        <div class="caStageShell">
            <div class="center">
                <canvas id="canvas"></canvas>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <aside id="rightPanel" class="panel right">
            <div class="panelHeader">
                <h2>Control</h2>
            </div>

            <div class="section">
                <h3>Parametri</h3>

                <label>Amplitudine U(t)
                    <input type="range" id="ampU" min="10" max="200" value="100">
                    <span id="ampUVal"></span>
                </label>

                <label>Amplitudine I(t)
                    <input type="range" id="ampI" min="10" max="200" value="100">
                    <span id="ampIVal"></span>
                </label>

                <label>Frecvență
                    <input type="range" id="freq" min="1" max="100" value="20">
                    <span id="freqVal"></span>
                </label>

                <label>Viteză
                    <input type="range" id="speed" min="1" max="100" value="50">
                    <span id="speedVal"></span>
                </label>

                <label>Fază
                    <input type="range" id="phase" min="0" max="628" value="0">
                    <span id="phaseVal"></span>
                </label>

                <label>Mod
                    <select id="mode">
                        <option value="ac">AC</option>
                        <option value="dc">DC</option>
                    </select>
                </label>
            </div>

            <div class="section">
                <h3>Măsurători</h3>
                <div class="box">
                    <div id="instant"></div>
                    <div id="power"></div>
                    <div id="impedance"></div>
                </div>
            </div>

            <div class="section">
                <h3>Grafic mic</h3>
                <canvas id="miniGraph"></canvas>
                <div class="legend">
                    <span class="u">U(t)</span>
                    <span class="i">I(t)</span>
                    <span class="p">P(t)</span>
                </div>
            </div>
            <canvas id="phasor"></canvas>
        </aside>

        <button type="button" id="toggleCaRight" class="ca-toggle ca-toggle-right" aria-controls="rightPanel" aria-expanded="true" aria-label="Panou control">☰</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
