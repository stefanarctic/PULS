<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Laser Lab</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="canvas" data-i18n-aria="aria.canvas" aria-label="Simulare optică laser"></canvas>

<button type="button" id="panelToggle" aria-controls="laserPanel" aria-expanded="true" data-i18n-aria="aria.closePanel" aria-label="Închide panoul de controale">☰</button>

<div class="panel" id="laserPanel">

<h2 data-i18n="sections.device">Laser Device</h2>

<label data-i18n="labels.angle">Unghi</label>
<input type="range" id="angle" min="-180" max="180" value="0">

<label data-i18n="labels.power">Putere</label>
<input type="range" id="power" min="1" max="15" value="8">

<hr>

<h2 data-i18n="sections.lasers">Lasere</h2>

<label data-i18n="labels.activeLaser">Laser activ</label>
<select id="laserSelect"></select>

<label data-i18n="labels.laserType">Tip laser</label>
<select id="laserType"></select>

<label data-i18n="labels.color">Culoare</label>
<select id="laserColor"></select>

<button type="button" id="addLaser" data-i18n="buttons.addLaser">Adaugă laser</button>
<button type="button" id="resetLaser" data-i18n="buttons.resetLaser">Reset laser</button>

<hr>

<h2 data-i18n="sections.optics">Optică</h2>

<label data-i18n="labels.element">Element</label>
<select id="tool">
  <option value="mirror_flat" data-i18n="tools.mirror_flat">Oglindă plană</option>
  <option value="mirror_concave" data-i18n="tools.mirror_concave">Oglindă concavă</option>
  <option value="mirror_convex" data-i18n="tools.mirror_convex">Oglindă convexă</option>
  <option value="prism" data-i18n="tools.prism">Prismă</option>
  <option value="lens_converging" data-i18n="tools.lens_converging">Lentilă convergentă</option>
  <option value="lens_diverging" data-i18n="tools.lens_diverging">Lentilă divergentă</option>
  <option value="beamsplitter" data-i18n="tools.beamsplitter">Beam splitter</option>
  <option value="detector" data-i18n="tools.detector">Detector optic</option>
  <option value="balloon_black" data-i18n="tools.balloon_black">Balon negru</option>
  <option value="balloon_red" data-i18n="tools.balloon_red">Balon roșu</option>
  <option value="balloon_blue" data-i18n="tools.balloon_blue">Balon albastru</option>
  <option value="balloon_green" data-i18n="tools.balloon_green">Balon verde</option>
  <option value="balloon_yellow" data-i18n="tools.balloon_yellow">Balon galben</option>
  <option value="balloon_white" data-i18n="tools.balloon_white">Balon alb</option>
  <option value="firework" data-i18n="tools.firework">Artificiu</option>
  <option value="protractor" data-i18n="tools.protractor">Raportor</option>
</select>

<button type="button" id="add" data-i18n="buttons.addToScene">Adaugă pe scenă</button>
<div class="hint" data-i18n="hint.drag">Trage cu mouse-ul elementele ca să le muți.</div>

<hr>

<h2 data-i18n="sections.scene">Scenă</h2>
<button type="button" id="deleteSelected" data-i18n="buttons.deleteSelected">Șterge selectat</button>

<div id="details" class="details"></div>

</div>

<script src="/simulari/simulator-i18n-runtime.js"></script>
<script src="/simulari/laser/laser-boot.js"></script>

</body>
</html>
