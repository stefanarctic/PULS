<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Simulator Gaze Ideale - Un Vas</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        .container {
            width: min(100% - 24px, 980px);
            margin: 16px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 0 12px #bbb;
            padding: 16px;
        }
        h1 { text-align: center; margin-bottom: 16px; font-size: clamp(1.15rem, 3.8vw, 1.8rem); }
        .flex { display: flex; gap: 16px; align-items: flex-start; }
        .sliders { flex: 1; min-width: 200px; }
        .sliders h3 { text-align: center; margin: 8px 0 12px; }
        .slider-group { margin-bottom: 14px; }
        .slider-group label { display: flex; justify-content: space-between; gap: 8px; font-size: 0.95rem; }
        .slider-group input[type="range"] { width: 100%; }
        .sim-area { flex: 2; min-width: 0; display: flex; flex-direction: column; align-items: center; }
        .canvas-wrap { position: relative; width: min(100%, 420px); }
        #mainCanvas {
            width: 100%;
            height: auto;
            background: #eaf2fb;
            border: 2px solid #444;
            border-radius: 16px;
            display: block;
            margin-bottom: 12px;
        }
        #divider { position: absolute; left: 50%; top: 0; width: 4px; height: 100%; background: rgba(100,100,100,0.18); z-index: 3; pointer-events: none; transition: height 0.2s; }
        .controls { text-align: center; margin: 12px 0; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        button { padding: 9px 16px; font-size: 1rem; border-radius: 6px; border: none; background: #705dbb; color: #fff; cursor: pointer; }
        button:hover { background: #624bbd; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #aaa; padding: 6px 10px; text-align: center; }
        th { background: #f5f5f5; }

        @media (max-width: 900px) {
            .flex { flex-wrap: wrap; }
            .sim-area { order: 1; flex: 1 1 100%; }
            .sliders { flex: 1 1 calc(50% - 8px); min-width: 0; }
            .container { padding: 14px; }
        }

        @media (max-width: 640px) {
            .container { width: 100%; margin: 0; border-radius: 0; padding: 12px; }
            .flex { gap: 10px; }
            .sliders { flex: 1 1 100%; }
            th, td { font-size: 0.85rem; padding: 5px 6px; }
            .slider-group label { font-size: 0.88rem; }
            button { width: 100%; max-width: 320px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1 data-i18n="h1">Simulator Gaze Ideale - Un Vas</h1>
    <div class="flex">
        <div class="sliders">
            <h3 data-i18n="side.left">Stânga</h3>
            <div class="slider-group">
                <label><span data-i18n="sliders.temperature">Temperatură (K):</span> <span id="temp1Value">300</span></label>
                <input type="range" id="temp1" min="100" max="1000" step="1" value="300">
            </div>
            <div class="slider-group">
                <label><span data-i18n="sliders.numMolecules">Număr de molecule:</span> <span id="numMolecules1Value">10</span></label>
                <input type="range" id="numMolecules1" min="1" max="100" step="1" value="10">
            </div>
            <div class="slider-group">
                <label><span data-i18n="sliders.molarMass">Masă molară (g/mol):</span> <span id="molarMass1Value">10</span></label>
                <input type="range" id="molarMass1" min="2" max="40" step="1" value="10">
            </div>
        </div>
        <div class="sim-area">
            <div class="canvas-wrap">
                <canvas id="mainCanvas" width="400" height="300"></canvas>
                <div id="divider"></div>
            </div>
            <div class="controls">
                <button type="button" id="toggleValveButton">Deschide Valvă</button>
                <button type="button" id="restartButton" data-i18n="buttons.restart">Restart</button>
            </div>
            <div class="slider-group" style="margin-bottom: 10px;">
                <label><span data-i18n="sliders.molarMassGlobal">Masă molară globală (g/mol):</span> <span id="molarMassGlobalValue">10</span></label>
                <input type="range" id="molarMassGlobal" min="2" max="40" step="1" value="10">
            </div>
            <table>
                <thead>
                    <tr>
                        <th data-i18n="table.parameter">Parametru</th>
                        <th data-i18n="table.left">Stânga</th>
                        <th data-i18n="table.right">Dreapta</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td data-i18n="table.rowNumMolecules">Număr molecule</td>
                        <td id="tableNumLeft">10</td>
                        <td id="tableNumRight">10</td>
                    </tr>
                    <tr>
                        <td data-i18n="table.rowMeanTemp">Temperatură medie (K)</td>
                        <td id="tableTempLeft">300</td>
                        <td id="tableTempRight">300</td>
                    </tr>
                    <tr>
                        <td data-i18n="table.rowMolarMass">Masă molară (g/mol)</td>
                        <td colspan="2" id="tableMasaGlobal">10</td>
                    </tr>
                    <tr>
                        <td data-i18n="table.rowPressure">Presiune (simulată)</td>
                        <td colspan="2" id="tablePresiune">0</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="sliders">
            <h3 data-i18n="side.right">Dreapta</h3>
            <div class="slider-group">
                <label><span data-i18n="sliders.temperature">Temperatură (K):</span> <span id="temp2Value">300</span></label>
                <input type="range" id="temp2" min="100" max="1000" step="1" value="300">
            </div>
            <div class="slider-group">
                <label><span data-i18n="sliders.numMolecules">Număr de molecule:</span> <span id="numMolecules2Value">10</span></label>
                <input type="range" id="numMolecules2" min="1" max="100" step="1" value="10">
            </div>
            <div class="slider-group">
                <label><span data-i18n="sliders.molarMass">Masă molară (g/mol):</span> <span id="molarMass2Value">10</span></label>
                <input type="range" id="molarMass2" min="2" max="40" step="1" value="10">
            </div>
        </div>
    </div>
</div>
<script src="/simulari/simulator-i18n-runtime.js"></script>
<script src="/simulari/Termodinamica/termodinamica-boot.js"></script>
</body>
</html>
