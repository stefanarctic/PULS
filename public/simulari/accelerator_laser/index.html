<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Accelerator Laser</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
</head>
<body>

<canvas id="simCanvas"></canvas>

<div class="controls">
  <label>Intensitatea Laserului</label>
  <input type="range" id="intensity" min="1" max="100" value="30">

  <label>Densitatea Plasmei</label>
  <input type="range" id="density" min="1" max="100" value="50">
</div>

<div id="infoCard" class="hidden">
  <h3>⚡ Ce vezi</h3>
  <p>
    Laserul creează o <strong>undă de plasmă</strong> (wakefield).<br>
    Electronul este prins în această undă și accelerat.
  </p>
  <div class="formula" id="formula-wave"></div>

  <h3>🧪 De ce contează</h3>
  <p>
    Această tehnică poate accelera particule pe distanțe de <strong>mii de ori mai mici</strong>
    decât acceleratoarele clasice, principiul din spatele <strong>ELI-NP</strong>.
  </p>
  <div class="formula" id="formula-gamma"></div>
</div>

<button id="toggleInfo" title="Ce se întâmplă?">📘</button>

<script src="script.js"></script>
<script>
  // KaTeX e `defer`, deci e sigur disponibil după DOMContentLoaded
  document.addEventListener("DOMContentLoaded", () => {
    katex.render("y(x,t) = A\\sin(kx - \\omega t)", document.getElementById("formula-wave"), {
      throwOnError: false,
      displayMode: false
    });
    katex.render("\\gamma = \\dfrac{1}{\\sqrt{1 - v^2/c^2}}", document.getElementById("formula-gamma"), {
      throwOnError: false,
      displayMode: true
    });
  });
</script>
</body>
</html>
