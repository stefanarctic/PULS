<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Accelerator Laser</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
</head>
<body>

<canvas id="simCanvas" data-i18n-aria="aria.canvas" aria-label="Simulare accelerare wakefield cu laser"></canvas>

<div class="controls">
  <label><span data-i18n="labels.intensity">Intensitatea Laserului</span></label>
  <input type="range" id="intensity" min="1" max="100" value="30">

  <label><span data-i18n="labels.density">Densitatea Plasmei</span></label>
  <input type="range" id="density" min="1" max="100" value="50">
</div>

<div id="infoCard" class="hidden">
  <h3 id="infoWhatsTitle">⚡ Ce vezi</h3>
  <p id="infoWhatsBody">
    Laserul creează o <strong>undă de plasmă</strong> (wakefield).<br>
    Electronul este prins în această undă și accelerat.
  </p>
  <div class="formula" id="formula-wave"></div>

  <h3 id="infoWhyTitle">🧪 De ce contează</h3>
  <p id="infoWhyBody">
    Această tehnică poate accelera particule pe distanțe de <strong>mii de ori mai mici</strong>
    decât acceleratoarele clasice, principiul din spatele <strong>ELI-NP</strong>.
  </p>
  <div class="formula" id="formula-gamma"></div>
</div>

<button id="toggleInfo" type="button" title="Ce se întâmplă?">📘</button>

<script src="/simulari/simulator-i18n-runtime.js"></script>
<script src="/simulari/accelerator_laser/accelerator-laser-boot.js"></script>
</body>
</html>
