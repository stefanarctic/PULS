<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <title>Simulator de Unde</title>
    <link rel="stylesheet" href="simulator-unde.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="titlemain">
        <h1 data-i18n="labels.pageTitle">Simulator de Unde</h1>
    </div>
    <div class="container">

        <div class="scene">
            <div class="faucet"></div>
            <div class="faucet" id="faucet2"></div>

            <div class="water" id="water"></div>
        </div>

    </div>
    <button id="toggleSidebar">☰</button>
    <div id="sidebar" class="sidebar hidden">
        <h2 data-i18n="labels.menuTitle">Meniu</h2>
        <div class="measurement-values">

            <div class="controls">
                <label>
                    <span data-i18n="labels.flowSpeed">Viteză curgere:</span>
                    <span id="speedValue">5</span>
                    <input type="range" id="speedSlider" min="1" max="10" step="1" value="5">
                </label>

                <label>
                    <span data-i18n="labels.dropSize">Mărime picătură:</span>
                    <span id="sizeValue">10</span>
                    <input type="range" id="sizeSlider" min="5" max="30" step="1" value="10">
                </label>

                <label><span data-i18n="labels.secondFaucet">Al doilea robinet:</span><input type="checkbox"
                        id="secondFaucetToggle"></label>

                <div><span data-i18n="labels.dropColor">Culoare picatura:</span></div>
                <input type="color" id="colorPicker" value="#00aaff">

                <div><span data-i18n="labels.waveColor">Culoare unda:</span></div>
                <input type="color" id="colorPick" value="#b2ebf2">

                <label><span data-i18n="labels.dropsCount">Picături:</span> <span id="dropCount">0</span></label>

                <div class="graph-section">
                    <h3 data-i18n="labels.chartHeading">Grafic timp → amplitudine</h3>
                    <div class="graph-legend">
                        <div data-i18n="labels.chartOy"><strong>OY</strong>: amplitudine (număr de unde)</div>
                        <div data-i18n="labels.chartOx"><strong>OX</strong>: timp</div>
                    </div>
                    <canvas id="amplitudeChart" width="250" height="150"></canvas>
                </div>

                <button id="toggleBtn" data-i18n="buttons.start">Start</button>
                <div class="spacer-bottom"></div>
                <div data-i18n="labels.measurementsHeading">Măsuratori:</div>
                <ul id="physicsDisplay"></ul>

                <div id="formulas" style="margin-top: 20px; font-size: 18px;"></div>

                <div class="spacer-bottom"></div>
            </div>
        </div>
    </div>

    <script src="/simulari/simulator-i18n-runtime.js"></script>
    <script src="unde-apa-boot.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>

</html>
