<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Constelații pe cer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="c" data-i18n-aria="aria.canvas" aria-label="Simulare bolta cerească și constelații"></canvas>
    <div
      id="north-compass"
      class="north-compass"
      title="Acul indică Steaua polară (Polul Nord ceresc). Dubhe–Merak din Carul Mare → Polaris → nord."
    >
      <div class="north-compass-dial">
        <div class="north-compass-needle" aria-hidden="true"></div>
        <span class="north-compass-n">N</span>
      </div>
    </div>
    <div id="sky-label" class="sky-label" hidden>
      <p class="learn-kicker" data-i18n="labels.kickerLearn">Învață</p>
      <h2 class="learn-title"></h2>
      <p class="learn-myth"></p>
      <p class="learn-find"><span class="learn-find-label" data-i18n="labels.findOnSky">Pe cer:</span> <span class="learn-find-text"></span></p>
    </div>
    <script src="/simulari/simulator-i18n-runtime.js"></script>
    <script src="/simulari/constelatii/constelatii-boot.js"></script>
  </body>
</html>
